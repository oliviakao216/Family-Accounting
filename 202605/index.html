<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每月家庭帳務記錄 (2026年5月)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 頂部標題與控制區 -->
        <header class="header">
            <div>
                <h1>家庭帳務系統</h1>
                <p class="subtitle">2026年 5月 帳務總覽</p>
            </div>
            <div style="display: flex; gap: 1rem;">
                <button id="print-btn" class="primary-btn" style="background-color: #4a5568; border-color: #2d3748;">
                    <span class="icon">🖨️</span> 匯出 PDF
                </button>
                <button id="export-btn" class="primary-btn" style="background-color: #38b2ac; border-color: #319795;">
                    <span class="icon">💾</span> 匯出儲存資料
                </button>
                <button id="run-match-btn" class="primary-btn">
                    <span class="icon">🔍</span> 執行每月自動比對 (蝦皮/酷澎/momo)
                </button>
            </div>
        </header>

        <div class="content-wrapper">
            <!-- 左側：分類統計小計 -->
            <aside class="sidebar">
                <h2>📊 家用分類小計</h2>
                <div class="summary-list" id="summary-list">
                    <!-- 分類小計會由 JS 動態生成 -->
                </div>
                <div class="total-box" style="margin-bottom: 2rem;">
                    <span>總支出</span>
                    <h3 id="grand-total">NT$ 0</h3>
                </div>

                <h2>📈 家庭開支小計</h2>
                <div class="summary-list" id="family-summary-list">
                    <!-- 家庭開支分類小計會由 JS 動態生成 -->
                </div>
                <div class="total-box" style="margin-bottom: 2rem;">
                    <span>總支出</span>
                    <h3 id="family-grand-total">NT$ 0</h3>
                </div>

                <div class="total-box" style="background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);">
                    <span>合併總計 (家用 + 家庭開支)</span>
                    <h3 id="combined-grand-total">NT$ 0</h3>
                </div>
            </aside>

            <!-- 右側：帳務明細表 -->
            <main class="main-content">
                <div class="main-header">
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <h2>📝 帳務明細 (以銀行資料為主)</h2>
                        <button id="add-manual-btn" class="primary-btn" style="padding: 0.3rem 0.8rem; font-size: 0.85rem; background: #ed8936; border-color: #dd6b20;">
                            ➕ 新增一筆
                        </button>
                    </div>
                    <div class="tabs" id="usage-tabs">
                        <button class="tab-btn active" data-tab="all">全部</button>
                        <button class="tab-btn" data-tab="家用">家用</button>
                        <button class="tab-btn" data-tab="私用">私用</button>
                        <button class="tab-btn" data-tab="家庭開支">家庭開支</button>
                    </div>
                </div>
                <div class="table-container">
                    <table class="transaction-table">
                        <thead>
                            <tr>
                                <th>銀行</th>
                                <th>日期</th>
                                <th>消費明細</th>
                                <th>分類 (可手動)</th>
                                <th>購買項目摘要 (可修改)</th>
                                <th>歸屬</th>
                                <th class="text-right">台幣金額</th>
                                <th class="text-right">外幣金額</th>
                                <th style="text-align: center;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-body">
                            <!-- 交易紀錄會由 JS 動態生成 -->
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- 衝突選擇彈窗 (Modal) -->
    <div id="conflict-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚠️ 偵測到相同金額訂單</h2>
                <p>請為銀行扣款 <strong id="conflict-bank-detail"></strong> (金額: <strong id="conflict-amount"></strong>) 選擇對應的電商訂單：</p>
            </div>
            <div class="modal-body" id="conflict-options">
                <!-- 選項由 JS 產生 -->
            </div>
            <div class="modal-footer">
                <button id="skip-conflict-btn" class="secondary-btn">略過此筆</button>
            </div>
        </div>
    </div>

    <!-- 載入腳本 -->
    <!-- 手動新增視窗 -->
    <div id="manual-modal" class="modal">
        <div class="modal-content" style="max-width: 500px; padding: 2rem;">
            <h3 style="color: var(--primary-color); margin-bottom: 1rem;">➕ 新增手動項目</h3>
            
            <label style="font-weight: bold; font-size: 0.9rem;">日期 (格式: 2026-05-XX)</label>
            <input type="text" id="manual-date" class="summary-input" style="width: 100%; margin-bottom: 1rem; border: 1px solid #e2e8f0; padding: 0.5rem;">
            
            <label style="font-weight: bold; font-size: 0.9rem;">消費明細</label>
            <input type="text" id="manual-details" class="summary-input" style="width: 100%; margin-bottom: 0.5rem; border: 1px solid #e2e8f0; padding: 0.5rem;">
            
            <!-- 快速輸入標籤區塊 -->
            <div id="quick-tags" style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem;">
                <!-- Tags will be rendered by JS -->
            </div>
            
            <label style="font-weight: bold; font-size: 0.9rem;">金額 (台幣)</label>
            <input type="number" id="manual-amount" class="summary-input" style="width: 100%; margin-bottom: 1rem; border: 1px solid #e2e8f0; padding: 0.5rem;">
            
            <label style="font-weight: bold; font-size: 0.9rem;">分類</label>
            <select id="manual-cat" class="cat-select" style="width: 100%; margin-bottom: 1rem; padding: 0.5rem;"></select>
            
            <label style="font-weight: bold; font-size: 0.9rem;">歸屬</label>
            <select id="manual-usage" class="usage-select" style="width: 100%; margin-bottom: 1.5rem; padding: 0.5rem;">
                <option value="家用" selected>家用</option>
                <option value="私用">私用</option>
                <option value="家庭開支">家庭開支</option>
            </select>
            
            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button id="cancel-manual-btn" class="primary-btn" style="background: #a0aec0;">取消</button>
                <button id="confirm-manual-btn" class="primary-btn">確認新增</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
