<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭帳務整理</title>
    <style>
        body { 
            font-family: 'Inter', 'Segoe UI', 'Microsoft JhengHei', sans-serif; 
            padding: 4rem; 
            background-color: #f3f6f9;
            background-image: radial-gradient(circle at 50% 0%, rgba(76, 81, 191, 0.1) 0%, transparent 50%);
            text-align: center; 
            color: #2d3748;
        }
        h1 { 
            font-size: 2.5rem; 
            margin-bottom: 3rem; 
            font-weight: 700;
        }
        .months-container {
            display: flex;
            justify-content: center;
            gap: 2rem;
        }
        .month-card { 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 3rem; 
            background: white; 
            border-radius: 16px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05), 0 10px 15px -3px rgba(0,0,0,0.1); 
            text-decoration: none; 
            color: #4c51bf; 
            font-size: 1.5rem; 
            font-weight: bold; 
            transition: all 0.3s ease; 
            border: 1px solid #e2e8f0;
        }
        .month-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            border-color: #4c51bf;
        }
        .icon-large {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <h1>請選擇月份</h1>
    <div class="months-container">
        <a href="202604/index.html" class="month-card">
            <span class="icon-large">📁</span>
            2026 年 04 月
        </a>
        <a href="202605/index.html" class="month-card">
            <span class="icon-large">📁</span>
            2026 年 05 月
        </a>
    </div>
</body>
</html>
